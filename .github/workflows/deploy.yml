name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_AUTH_BLACK_EMAIL: ${{ vars.PUBLIC_AUTH_BLACK_EMAIL || secrets.PUBLIC_AUTH_BLACK_EMAIL || 'black@cat.com' }}
      PUBLIC_AUTH_WHITE_EMAIL: ${{ vars.PUBLIC_AUTH_WHITE_EMAIL || secrets.PUBLIC_AUTH_WHITE_EMAIL || 'white@cat.com' }}
      PUBLIC_AUTH_BLACK_LABEL: ${{ vars.PUBLIC_AUTH_BLACK_LABEL || secrets.PUBLIC_AUTH_BLACK_LABEL }}
      PUBLIC_AUTH_WHITE_LABEL: ${{ vars.PUBLIC_AUTH_WHITE_LABEL || secrets.PUBLIC_AUTH_WHITE_LABEL }}

    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
